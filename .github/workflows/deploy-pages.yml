name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      VITE_APP_BASE_PATH: ${{ vars.VITE_APP_BASE_PATH }}
      VITE_PEER_HOST: ${{ vars.VITE_PEER_HOST }}
      VITE_PEER_PORT: ${{ vars.VITE_PEER_PORT }}
      VITE_PEER_PATH: ${{ vars.VITE_PEER_PATH }}
      VITE_PEER_SECURE: ${{ vars.VITE_PEER_SECURE }}
      VITE_PEER_DEBUG: ${{ vars.VITE_PEER_DEBUG }}
      VITE_STUN_URLS: ${{ vars.VITE_STUN_URLS }}
      VITE_TURN_URLS: ${{ vars.VITE_TURN_URLS }}
      VITE_TURN_USERNAME: ${{ vars.VITE_TURN_USERNAME }}
      VITE_TURN_CREDENTIAL: ${{ vars.VITE_TURN_CREDENTIAL }}
      VITE_RELAY_BACKEND_URL: ${{ vars.VITE_RELAY_BACKEND_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
