services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      CHOKIDAR_USEPOLLING: 'true'
      CHOKIDAR_INTERVAL: '300'
      VITE_RELAY_BACKEND_URL: http://localhost:8787
      VITE_HMR_HOST: localhost
      VITE_HMR_CLIENT_PORT: '5173'
    ports:
      - '5173:5173'
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      BLOB_READ_WRITE_TOKEN: ${BLOB_READ_WRITE_TOKEN:-}
      NODEMON_LEGACY_WATCH: 'true'
      RELAY_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      RELAY_PORT: '8787'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:8787/api/health'').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    ports:
      - '8787:8787'
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules

volumes:
  frontend_node_modules:
  backend_node_modules:
